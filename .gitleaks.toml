title = "ledger gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "dutch-iban"
description = "Dutch IBAN account number"
regex = '''\bNL[0-9]{2}[A-Z]{4}[0-9]{10}\b'''
keywords = ["nl"]

[[rules]]
id = "private-ipv4"
description = "RFC 1918 private IPv4 address"
# The final octet is required to be non-zero: Go's RE2 engine has no
# lookahead, and a trailing ".0" is a CIDR network address (e.g. the
# "10.0.0.0/8" written out when describing the range itself), never an
# assignable host, so excluding it removes that documentation-only false
# positive without losing any ability to catch a real leaked host address.
regex = '''\b(?:10\.(?:[0-9]{1,3}\.){2}[1-9][0-9]{0,2}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[1-9][0-9]{0,2}|192\.168\.[0-9]{1,3}\.[1-9][0-9]{0,2})\b'''

[[rules]]
id = "email-address"
description = "Email address that is not a placeholder or GitHub noreply address"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''

  [[rules.allowlists]]
  description = "placeholder and GitHub noreply domains are not personal data"
  regexTarget = "match"
  regexes = [
    '''(?i)@example\.com$''',
    '''(?i)@example\.org$''',
    '''(?i)@example\.net$''',
    '''(?i)@users\.noreply\.github\.com$''',
  ]

  [[rules.allowlists]]
  description = "systemd templated unit instance names (unit@instance.service) look like emails but are not"
  regexTarget = "match"
  regexes = [
    '''(?i)@[A-Za-z0-9.-]+\.(service|timer|socket|target|mount|path|slice|scope)$''',
  ]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "planning documentation discusses APIs in prose without embedding real keys"
  paths = [
    '''\.plannin[g]/''',
  ]

[[allowlists]]
description = "public Sigstore bundle fixtures are intentionally not real secrets"
paths = [
  '''deploy/tests/fixtures/''',
]
