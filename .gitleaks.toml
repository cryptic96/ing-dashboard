title = "ledger gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "dutch-iban"
description = "Dutch IBAN account number"
# Compact or written in the usual groups of four, in any letter case.
regex = '''(?i)\bNL[0-9]{2} ?[A-Z]{4} ?[0-9]{4} ?[0-9]{4} ?[0-9]{2}\b'''
keywords = ["nl"]

[[rules]]
id = "private-ipv4"
description = "RFC 1918 private IPv4 address"
# The final octet is required to be non-zero: Go's RE2 engine has no
# lookahead, and a trailing ".0" is a CIDR network address (e.g. the
# "10.0.0.0/8" written out when describing the range itself), never an
# assignable host, so excluding it removes that documentation-only false
# positive without losing any ability to catch a real leaked host address.
regex = '''\b(?:10\.(?:[0-9]{1,3}\.){2}[1-9][0-9]{0,2}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[1-9][0-9]{0,2}|192\.168\.[0-9]{1,3}\.[1-9][0-9]{0,2})\b'''

[[rules]]
id = "email-address"
description = "Email address that is not a placeholder or GitHub noreply address"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''

  [[rules.allowlists]]
  description = "placeholder and GitHub noreply domains are not personal data"
  regexTarget = "match"
  regexes = [
    '''(?i)@example\.com$''',
    '''(?i)@example\.org$''',
    '''(?i)@example\.net$''',
    '''(?i)@users\.noreply\.github\.com$''',
  ]

  [[rules.allowlists]]
  description = "reserved and non-delegated placeholder top-level domains cannot receive mail"
  regexTarget = "match"
  regexes = [
    '''(?i)@[A-Za-z0-9.-]+\.(test|example|invalid|localhost|tld)$''',
  ]

  [[rules.allowlists]]
  description = "systemd templated unit instance names (unit@instance.service) look like emails but are not"
  regexTarget = "match"
  regexes = [
    '''(?i)@[A-Za-z0-9.-]+\.(service|timer|socket|target|mount|path|slice|scope)$''',
  ]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "one line of architecture prose names the REST API next to Grafana and Prometheus; only that exact phrase in that file is allowed"
  condition = "AND"
  regexTarget = "match"
  paths = [
    '''(^|/)\.plannin[g]/research/ARCHITECTURE\.md$''',
  ]
  regexes = [
    '''^API, Grafana/Prometheus$''',
  ]

  [[rules.allowlists]]
  description = "pinned OpenPGP key fingerprints of public package signing keys are public identifiers, not secrets"
  condition = "AND"
  regexTarget = "match"
  paths = [
    '''(^|/)deploy/versions\.env$''',
  ]
  regexes = [
    '''^[A-Z0-9_]+_KEY_FINGERPRINT=[0-9A-F]{40}$''',
  ]

[[allowlists]]
description = "public Sigstore bundle fixtures are intentionally not real secrets"
paths = [
  '''deploy/tests/fixtures/''',
]

[[allowlists]]
description = "gitignored build and test output cannot be committed; the history scan covers everything that can"
paths = [
  '''(^|/)Ledger\.[A-Za-z]+/(bin|obj)/''',
  '''(^|/)artifacts/''',
  '''(^|/)TestResults/''',
]
