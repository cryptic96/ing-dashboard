# Installed as /etc/postgresql/<major>/main/pg_ident.conf by
# deploy/provision.d/30-postgresql.sh. Only the two roles whose name
# differs from the OS user connecting as them need an explicit map;
# ledger_migrator and ledger_backup match their OS user 1:1 and need none.
#
# MAPNAME                SYSTEM-USERNAME  PG-USERNAME
ledger_runtime_map        ledger           ledger_runtime
grafana_reader_map        grafana          grafana_reader
