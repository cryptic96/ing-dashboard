# Installed as /etc/postgresql/<major>/main/pg_hba.conf by
# deploy/provision.d/30-postgresql.sh. Every line is a local (Unix socket)
# peer-authenticated line; there is no host, hostssl or hostnossl line
# anywhere in this file, because the socket is the only way in.
#
# TYPE   DATABASE  USER            ADDRESS  METHOD
local    all       postgres                 peer
local    ledger    ledger_runtime           peer map=ledger_runtime_map
local    ledger    ledger_migrator          peer
local    ledger    grafana_reader           peer map=grafana_reader_map
local    ledger    ledger_backup            peer
