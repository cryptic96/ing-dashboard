# Installed as /etc/postgresql/<major>/main/conf.d/ledger.conf by
# deploy/provision.d/30-postgresql.sh. PostgreSQL is reachable only over
# its Unix socket for this single-LXC deployment; nothing here opens a
# network listener.

# No TCP listener at all -- the only way in is the local Unix socket.
listen_addresses = ''

# Defence in depth: no passwords are ever set (peer auth only), but a
# strong default keeps the option from silently falling back to something
# weaker if that ever changes.
password_encryption = scram-sha-256

# Connection audit trail lives in journald via the systemd unit.
log_connections = on
log_disconnections = on
