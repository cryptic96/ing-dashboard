# Grafana configuration installed as /etc/grafana/grafana.ini by the root
# installer on every deploy. Nothing here is server-specific: the domain,
# root URL, SMTP relay and alert address all come from /etc/ledger/grafana.env
# through the grafana-server systemd drop-in, never from this file.
#
# This file is the durable lockdown: reinstalling it on every deploy means a
# UI change (or an operator mistake) can never leave anonymous access, public
# dashboards or snapshot sharing durably re-enabled.

[paths]
provisioning = /etc/grafana/provisioning

[server]
http_port = 3000
enforce_domain = true

[log]
mode = console

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[security]
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
strict_transport_security = true
content_security_policy = true
x_content_type_options = true
allow_embedding = false
disable_brute_force_login_protection = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[auth]
disable_login_form = false

[auth.basic]
enabled = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false
editors_can_admin = false

[unified_alerting]
enabled = true
