# Dashboard provider. Every dashboard ships in English and Dutch, is generated
# by the Ledger.Dashboards tool from one definition and one translation file,
# and is never edited by hand or in the Grafana UI: change the definition and
# run the tool instead. The installer copies this whole provisioning tree to
# /etc/grafana/provisioning, so the generated JSON lives next to this file.
apiVersion: 1

providers:
  - name: ledger
    orgId: 1
    folder: Household Ledger
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
