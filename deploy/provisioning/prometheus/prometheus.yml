# Installed as /etc/prometheus/prometheus.yml by the root installer.
# Everything here is loopback-only: no remote write, no Alertmanager (alert
# rules and routing live in Grafana's own unified alerting instead), and no
# scrape target reachable from anywhere but this host.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: ledger
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:5081']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
