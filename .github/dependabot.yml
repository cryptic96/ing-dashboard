version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/build/lint"
    schedule:
      interval: "weekly"
    ignore:
      # The host runs the Prometheus LTS line pinned in deploy/versions.env;
      # the lint image's promtool stays on the same line, so only patch
      # releases are proposed.
      - dependency-name: "prom/prometheus"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
