name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.tag.outputs.version }}

    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: build/validate-release-tag.sh >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Package release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: build/package-release.sh --version "$VERSION" --commit "$GITHUB_SHA" --output artifacts/release

      - name: Run tests
        run: dotnet test Ledger.slnx --no-restore
        env:
          ConnectionStrings__TestAdmin: Host=localhost;Port=5432;Username=postgres
          LEDGER_EFBUNDLE: ${{ github.workspace }}/artifacts/release/stage/efbundle
          CI: true

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/ledger-${{ steps.tag.outputs.version }}.zip

      - name: Save attestation bundle for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: cp "$BUNDLE_PATH" "artifacts/release/ledger-$VERSION.zip.sigstore.json"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          zip_asset="artifacts/release/ledger-$VERSION.zip"
          checksum_asset="artifacts/release/ledger-$VERSION.zip.sha256"
          bundle_asset="artifacts/release/ledger-$VERSION.zip.sigstore.json"

          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" = "true" ]; then
              gh release upload "$TAG" "$zip_asset" "$checksum_asset" "$bundle_asset" --clobber
            else
              echo "::error::Release $TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes "Automated draft release. Approve the deploy environment to publish it." \
              "$zip_asset" "$checksum_asset" "$bundle_asset"
          fi

  publish:
    needs: build
    environment: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --clobber

      - name: Verify release checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "ledger-$VERSION.zip.sha256"

      - name: Re-verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation verify "release/ledger-$VERSION.zip" \
            --bundle "release/ledger-$VERSION.zip.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
